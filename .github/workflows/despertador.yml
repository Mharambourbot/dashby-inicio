name: Despertador

# Abre la app varias veces al día (todos los días) para que Streamlit no la duerma.
# Horas en UTC. Chile verano (UTC-3): 7:40, 10:40, 13:40, 16:40 y 20:40.
on:
  schedule:
    - cron: "40 10,13,16,19,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: despertador
  cancel-in-progress: false

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Visitar la app
        run: python despertador.py
      # GitHub apaga las tareas programadas de un repo público si pasan 60 días sin cambios.
      # Si el último cambio tiene más de 45 días, deja una marca para que siga activa.
      - name: Mantener activa la tarea
        if: always()
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            date -u +%F > .despertador
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .despertador
            git commit -m "Despertador: marca de actividad"
            git push
          fi
